services:
  app:
    image: estuary-app:local
    build:
      context: .
      target: runner
    env_file:
      - ${ESTUARY_ENV_FILE:-.env.server}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '${ESTUARY_PORT:-3000}:3000'
    networks:
      - database
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/system/bootstrap').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  database:
    external: true
    name: ${ESTUARY_DATABASE_NETWORK:-estuary-db_default}
